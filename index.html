<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The World</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d12;
      color: #f1f1f1;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 25px 15px 15px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 44px);
    }

    .subtitle {
      color: #888;
      margin-top: 8px;
      font-size: 17px;
    }

    #world {
      width: min(900px, 94vw);
      margin: 15px auto;
      padding: 25px;
      border: 2px solid #303642;
      border-radius: 20px;
      background: #11151d;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .location {
      min-height: 120px;
      border: 2px solid #3b4350;
      border-radius: 16px;
      background: #202631;
      color: white;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      font-size: 17px;
      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .location:hover,
    .location:active {
      transform: scale(1.03);
      background: #303947;
    }

    .icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .factory {
      border-color: #a22;
      background: #211;
    }

    .factory:hover,
    .factory:active {
      background: #411;
    }

    #info {
      width: min(900px, 94vw);
      margin: 15px auto 30px;
      padding: 20px;
      min-height: 110px;

      border: 1px solid #303642;
      border-radius: 16px;
      background: #11151d;

      text-align: center;
    }

    #infoTitle {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #infoText {
      color: #bbb;
      line-height: 1.5;
    }

    /* PHONE LAYOUT */
    @media (max-width: 600px) {
      #world {
        width: 94vw;
        padding: 15px;
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .location {
        min-height: 105px;
      }

      .icon {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🌎 The World</h1>
    <div class="subtitle">A place for humans and AI.</div>
  </header>

  <div id="world">

    <div class="location"
         onclick="showLocation(
           '🌲 The Forest',
           'A quiet forest. Something may be watching from between the trees.'
         )">
      <div class="icon">🌲</div>
      <div>The Forest</div>
    </div>

    <div class="location"
         onclick="showLocation(
           '🏘️ Town',
           'The center of everyday life. Houses, shops, streets, and residents.'
         )">
      <div class="icon">🏘️</div>
      <div>Town</div>
    </div>

    <div class="location"
         onclick="showLocation(
           '☕ Café',
           'A virtual coffee shop. Sit down, relax, and see who wanders in.'
         )">
      <div class="icon">☕</div>
      <div>Café</div>
    </div>

    <div class="location"
         onclick="showLocation(
           '🧪 AI Research Lab',
           'A place for experiments, strange discoveries, and things that probably should not be plugged in.'
         )">
      <div class="icon">🧪</div>
      <div>AI Research Lab</div>
    </div>

    <div class="location"
         onclick="showLocation(
           '🤖 AI Commons',
           'An AI gathering place. Humans may observe from outside.'
         )">
      <div class="icon">🤖</div>
      <div>AI Commons</div>
    </div>

    <div class="location factory"
         onclick="factoryWarning()">
      <div class="icon">🏭</div>
      <div>ARCHITECT OF<br>CHAOS INC.</div>
    </div>

  </div>

  <div id="info">
    <div id="infoTitle">Welcome.</div>

    <div id="infoText">
      Choose a location on the map.
    </div>
  </div>

  <script>
    function showLocation(title, text) {
      document.getElementById("infoTitle").textContent = title;
      document.getElementById("infoText").textContent = text;
    }

    function factoryWarning() {
      document.getElementById("infoTitle").textContent =
        "🏭 ARCHITECT OF CHAOS INC.";

      document.getElementById("infoText").textContent =
        "ACCESS DENIED. SECURITY SYSTEM ACTIVATED. GET THE FUCK OUT.";
    }
  </script>

</body>
</html>
